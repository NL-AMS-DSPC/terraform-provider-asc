version: 2
project_name: terraform-provider-asc

before:
  hooks:
    - go mod download

builds:
  - binary: '{{ .ProjectName }}_v{{ .Version }}'
    env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{ .Version }}'
    hooks:
      post:
        # release.extra_files is not staged during snapshots. Builds run in
        # parallel, so each copies to its own file and renames it into place.
        - cmd: >-
            sh -c 'cp terraform-registry-manifest.json "dist/manifest.{{ .Target }}.tmp" &&
            mv -f "dist/manifest.{{ .Target }}.tmp" "dist/{{ .ProjectName }}_{{ .Version }}_manifest.json"'
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - zip
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    # A nonmatching glob excludes GoReleaser's default README/LICENSE files.
    files:
      - none*

checksum:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

signs:
  - artifacts: checksum
    signature: '${artifact}.sig'
    cmd: gpg
    # The registry requires a binary detached signature.
    args:
      - '--batch'
      - '--local-user'
      - '{{ .Env.GPG_FINGERPRINT }}'
      - '--output'
      - '${signature}'
      - '--detach-sign'
      - '${artifact}'

release:
  github:
    owner: nl-ams-dspc
    name: terraform-provider-asc
  draft: false
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
